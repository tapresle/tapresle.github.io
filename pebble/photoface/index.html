<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PhotoWatch Rotate — Configuration</title>
<style>
  body {
    font-family: -apple-system, Helvetica, Arial, sans-serif;
    background: #111;
    color: #eee;
    margin: 0;
    padding: 16px;
  }
  h1 { font-size: 20px; margin-bottom: 4px; }
  p.hint { color: #999; font-size: 13px; margin-top: 0; }
  #dropzone {
    border: 2px dashed #555;
    border-radius: 8px;
    padding: 24px;
    text-align: center;
    margin: 16px 0;
    cursor: pointer;
  }
  #dropzone.dragover { border-color: #4da3ff; background: #1a2733; }
  #fileInput { display: none; }
  #grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
    gap: 10px;
    margin: 16px 0;
  }
  .thumb {
    position: relative;
    border-radius: 6px;
    overflow: hidden;
    background: #222;
    aspect-ratio: 1 / 1;
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb button {
    position: absolute;
    top: 2px;
    right: 2px;
    background: rgba(0,0,0,0.7);
    color: #fff;
    border: none;
    border-radius: 50%;
    width: 22px;
    height: 22px;
    line-height: 22px;
    text-align: center;
    cursor: pointer;
    font-size: 13px;
  }
  select, button.primary {
    width: 100%;
    padding: 12px;
    font-size: 15px;
    border-radius: 8px;
    border: none;
    margin-top: 8px;
  }
  select { background: #222; color: #eee; border: 1px solid #444; }
  button.primary { background: #4da3ff; color: #001426; font-weight: 600; cursor: pointer; margin-top: 20px; }
  button.primary:disabled { background: #444; color: #888; cursor: not-allowed; }
  #status { font-size: 13px; color: #999; margin-top: 8px; min-height: 18px; }
  canvas { display: none; }
</style>
</head>
<body>

<h1>PhotoWatch Rotate</h1>
<p class="hint">Pick up to <span id="maxImages">6</span> photos. They'll rotate randomly on your watch each time it wakes.</p>

<div id="dropzone">
  <div>Tap to choose photos</div>
  <input type="file" id="fileInput" accept="image/*" multiple>
</div>

<div id="grid"></div>

<label for="watchStyle" style="font-size:13px;color:#999;">Watch style</label>
<select id="watchStyle">
  <option value="0">Classic</option>
  <option value="1">Minimal</option>
  <option value="2">Bold</option>
</select>

<button class="primary" id="submitBtn" disabled>Send to watch</button>
<div id="status"></div>

<div id="debugLog" style="font-size:11px;color:#666;margin-top:16px;white-space:pre-wrap;border-top:1px solid #333;padding-top:8px;"></div>

<canvas id="workCanvas"></canvas>

<script>
// ----------------------------------------------------------------------------
// Debug helpers — visible without remote devtools
// ----------------------------------------------------------------------------
const debugLogEl = document.getElementById('debugLog');
function debugLog(msg) {
  const line = document.createElement('div');
  line.textContent = new Date().toLocaleTimeString() + '  ' + msg;
  debugLogEl.appendChild(line);
  console.log(msg);
}

// Catches syntax/runtime errors that would otherwise fail completely silently
// in a webview with no devtools attached.
window.onerror = function(message, source, lineno, colno, error) {
  alert('Page error: ' + message + ' (line ' + lineno + ')');
  debugLog('ERROR: ' + message + ' at line ' + lineno);
  return false;
};

// ----------------------------------------------------------------------------
// Config
// ----------------------------------------------------------------------------
// Must match MAX_IMAGES in photowatch.c
const MAX_IMAGES = 6;

// Target output resolution per platform. Adjust these to match the exact
// framebuffer size of your target watch(es).
const PLATFORM_DIMENSIONS = {
  pt2: { width: 200, height: 228, round: false }, // Pebble Time 2 (rectangular)
  pr2: { width: 180, height: 180, round: true },   // Pebble Time 2 Round
};

function getPlatform() {
  const params = new URLSearchParams(window.location.search);
  return params.get('platform') || 'pt2';
}

const platform = getPlatform();
const dims = PLATFORM_DIMENSIONS[platform] || PLATFORM_DIMENSIONS.pt2;

document.getElementById('maxImages').textContent = MAX_IMAGES;

debugLog('Script started. platform=' + platform + ' dims=' + dims.width + 'x' + dims.height);
debugLog('window.location.href = ' + window.location.href);

// ----------------------------------------------------------------------------
// State
// ----------------------------------------------------------------------------
let images = []; // { base64, thumbUrl }

const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const grid = document.getElementById('grid');
const submitBtn = document.getElementById('submitBtn');
const statusEl = document.getElementById('status');
const canvas = document.getElementById('workCanvas');
const ctx = canvas.getContext('2d');

dropzone.addEventListener('click', () => fileInput.click());
dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('dragover'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
dropzone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropzone.classList.remove('dragover');
  handleFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

function handleFiles(fileList) {
  const files = Array.from(fileList).filter(f => f.type.startsWith('image/'));
  const room = MAX_IMAGES - images.length;
  if (room <= 0) {
    setStatus(`Already have ${MAX_IMAGES} photos — remove one to add another.`);
    return;
  }
  files.slice(0, room).forEach(processFile);
  fileInput.value = '';
}

function processFile(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const base64 = resizeAndEncode(img);
      images.push({ base64 });
      renderGrid();
    };
    img.onerror = () => setStatus(`Could not read ${file.name}`);
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

/**
 * Resizes/crops the source image to fill the watch's target resolution
 * (cover-fit, centered) and returns a base64-encoded PNG (no data: prefix).
 * Also masks to a circle for round platforms.
 */
function resizeAndEncode(img) {
  canvas.width = dims.width;
  canvas.height = dims.height;
  ctx.clearRect(0, 0, dims.width, dims.height);

  // cover-fit scaling
  const scale = Math.max(dims.width / img.width, dims.height / img.height);
  const drawW = img.width * scale;
  const drawH = img.height * scale;
  const dx = (dims.width - drawW) / 2;
  const dy = (dims.height - drawH) / 2;

  if (dims.round) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(dims.width / 2, dims.height / 2, Math.min(dims.width, dims.height) / 2, 0, Math.PI * 2);
    ctx.closePath();
    ctx.clip();
  }

  ctx.drawImage(img, dx, dy, drawW, drawH);

  if (dims.round) {
    ctx.restore();
  }

  const dataUrl = canvas.toDataURL('image/png');
  return dataUrl.split(',')[1]; // strip "data:image/png;base64,"
}

function renderGrid() {
  grid.innerHTML = '';
  images.forEach((item, idx) => {
    const div = document.createElement('div');
    div.className = 'thumb';

    const img = document.createElement('img');
    img.src = 'data:image/png;base64,' + item.base64;
    div.appendChild(img);

    const removeBtn = document.createElement('button');
    removeBtn.textContent = '\u2715';
    removeBtn.onclick = () => {
      images.splice(idx, 1);
      renderGrid();
    };
    div.appendChild(removeBtn);

    grid.appendChild(div);
  });

  submitBtn.disabled = images.length === 0;
  setStatus(`${images.length} / ${MAX_IMAGES} photos selected. Approx. payload: ${estimateSizeKb()} KB.`);
}

function estimateSizeKb() {
  const totalChars = images.reduce((sum, i) => sum + i.base64.length, 0);
  const bytes = Math.round(totalChars * 0.75);
  return (bytes / 1024).toFixed(1);
}

function setStatus(msg) {
  statusEl.textContent = msg;
}

// ----------------------------------------------------------------------------
// Submit — hand data back to pebble-js-app (index.js)
// ----------------------------------------------------------------------------

// Rough safety ceiling: some mobile webviews truncate or reject very long
// pebble://close URLs. If you hit this, reduce MAX_IMAGES, lower the target
// resolution in PLATFORM_DIMENSIONS, or send fewer photos at once.
const MAX_PAYLOAD_BYTES = 150 * 1024; // ~150 KB

// Warn (but don't silently fail) if this page was opened outside the real
// Pebble config flow — pebble://close only does anything inside the app.
const inPebbleWebview = /Pebble/i.test(navigator.userAgent) || window.location.search.includes('platform=');
if (!inPebbleWebview) {
  console.warn('This page does not appear to be running inside the Pebble app\'s configuration webview. "Send to watch" will not work when previewed in a normal browser.');
}

submitBtn.addEventListener('click', () => {
  debugLog('Send button clicked. images=' + images.length);

  try {
    const settings = {
      images: images.map(i => i.base64),
      watch_style: document.getElementById('watchStyle').value,
    };

    const payload = encodeURIComponent(JSON.stringify(settings));
    const payloadBytes = payload.length; // encodeURIComponent output is ASCII, 1 byte/char

    debugLog('Encoded payload: ' + payloadBytes + ' bytes.');

    if (payloadBytes > MAX_PAYLOAD_BYTES) {
      setStatus(`Payload too large (${(payloadBytes / 1024).toFixed(0)} KB). Remove a photo or lower resolution and try again.`);
      debugLog('Refused: payload exceeds MAX_PAYLOAD_BYTES (' + MAX_PAYLOAD_BYTES + ').');
      return;
    }

    setStatus(`Sending ${images.length} photo(s), ${(payloadBytes / 1024).toFixed(1)} KB…`);
    submitBtn.disabled = true;

    const returnTo = 'pebble://close#' + payload;
    debugLog('Navigating to pebble://close (payload omitted from log).');

    // Give the status message a chance to paint before we navigate away.
    setTimeout(() => {
      // Method 1: direct navigation (standard documented approach).
      document.location = returnTo;

      // Method 2: synthetic anchor click, as a fallback — some webviews
      // handle custom URI schemes more reliably via a real click event
      // than via a script-driven location assignment.
      setTimeout(() => {
        debugLog('Still on page after Method 1 — trying anchor-click fallback.');
        const a = document.createElement('a');
        a.href = returnTo;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);

        // If we're STILL here after both attempts, pebble://close is not
        // being intercepted at all in this webview.
        setTimeout(() => {
          alert('Neither navigation method triggered a response from the Pebble app. This page may not be running inside the real config webview, or this app build does not support pebble://close.');
          setStatus('No response from the Pebble app after two navigation attempts — see alert.');
          submitBtn.disabled = false;
        }, 800);
      }, 800);
    }, 50);
  } catch (err) {
    alert('Error building payload: ' + err.message);
    debugLog('ERROR building payload: ' + err.message);
    setStatus('Something went wrong preparing the data.');
    submitBtn.disabled = false;
  }
});
</script>
</body>
</html>
